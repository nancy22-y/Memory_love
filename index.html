<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Long+Cang&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<title>微光 · 治愈陪伴</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"></svg>
<div id="bgVeil"></div>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="app">
<main>
<!-- 首页 -->
<section class="view on" id="v-home">
  <h1 id="hello">你好呀</h1><div class="sub hand" id="aff" style="font-size:17px;line-height:1.7"></div><div style="height:14px"></div>
  <div class="card" style="text-align:center">
    <div class="av big" id="hAv" style="margin:0 auto 8px"></div>
    <h2 id="hName"></h2><div class="sub" id="hDesc"></div>
    <div style="margin-top:14px"><button class="btn" onclick="go('chat')">去聊聊 💬</button></div>
  </div>
  <div class="card"><h2>此刻的心情</h2><div class="moods" id="moodPick"></div>
    <div class="sub" id="moodNote" style="margin-top:10px;text-align:center">点一下，今天的你也被好好记住了</div></div>
  <div class="card" id="gCard"><h2 id="gTitle"></h2><div class="sub" id="gText" style="color:var(--tx);font-size:14.5px;white-space:pre-wrap"></div><div style="margin-top:12px"><button class="btn" id="gBtn" onclick="getGreet()">收下 TA 的问候 💌</button></div></div>
  <div class="card"><h2>最近 7 天</h2><div class="bars" id="bars"></div></div>
  <div class="card"><h2>我的TA们</h2><div class="chips" id="charList"></div></div>
</section>
<!-- 聊天 -->
<section class="view" id="v-chat">
  <div class="chead"><div class="av" id="cAv"></div><div><b id="cName"></b><div class="sub" style="font-size:12px" id="cSt"></div></div>
    <span style="margin-left:auto;display:flex;gap:6px"><button class="chip" onclick="clearChat()">新话题</button></span></div>
  <div class="pinnote hand" id="pin"></div>
  <div id="msgs"></div>
  <div id="pv"></div>
  
  <!-- 隐藏工具抽屉 -->
  <button class="drawer-toggle" onclick="toggleDrawer()">✨ 点开选择工具 / 心情 / 快捷语 ▾</button>
  <div class="drawer" id="toolsDrawer">
    <div class="sub" style="font-size:11px;margin-bottom:4px">此刻心情</div>
    <div class="chips" id="cm" style="margin:0 0 6px"></div>
    <div class="sub" style="font-size:11px;margin-bottom:4px">交流模式</div>
    <div class="chips" id="modes" style="margin:0 0 6px"></div>
    <div class="sub" style="font-size:11px;margin-bottom:4px">快捷短句</div>
    <div class="chips" id="quick" style="margin:0 0 6px"></div>
    <div class="sub" style="font-size:11px;margin-bottom:4px">互动动作与表情</div>
    <div class="chips" id="tools" style="margin:0 0 6px"></div>
    <div class="chips" id="stk" style="display:none;margin:4px 0"></div>
  </div>

  <div class="send"><input type="file" id="pIn" accept="image/*" hidden><button class="btn ghost" style="padding:12px 14px" onclick="$('pIn').click()" title="分享照片">📷</button><textarea id="inp" placeholder="想说什么都可以…" rows="1"></textarea><button class="btn" id="sendBtn">发送</button></div>
</section>
<!-- 创造 -->
<section class="view" id="v-make">
  <h1>创造 TA</h1><div class="sub">TA 的一切都由你决定。随时可以修改，不会有人评判。</div><div style="height:10px"></div>
  <div class="card">
    <label style="margin-top:0">头像</label><div class="row" style="margin-bottom:8px"><div class="av" id="fPrev"></div><div><input type="file" id="fImg" accept="image/*" hidden><button class="chip" onclick="$('fImg').click()">📷 上传自己的头像</button></div></div><div class="chips" id="fAvs"></div>
    <label>颜色</label><div class="chips" id="fCols"></div>
    <label>名字</label><input id="fName" maxlength="12" placeholder="例如：星野、阿屿、小夏">
    <label>TA 怎么称呼你（可写多个，用顿号隔开，TA 会轮着叫）</label><input id="fNick" maxlength="40" placeholder="例如：宝贝、小满、乖"><div class="chips" style="margin-top:8px"><button class="chip" onclick="addNick('宝贝')">宝贝</button><button class="chip" onclick="addNick('乖')">乖</button><button class="chip" onclick="addNick('小朋友')">小朋友</button><button class="chip" onclick="addNick('公主')">公主</button><button class="chip" onclick="addNick('傻瓜')">傻瓜</button><button class="chip" onclick="addNick('小笨蛋')">小笨蛋</button></div>
    <label>TA 的身份</label><div class="chips" id="fGender"></div>
    <label>性格（可多选）</label><div class="chips" id="fPers"></div>
    <label>人物特点 / 背景故事</label><textarea id="fBio" rows="3" placeholder="例如：温柔的天文系学生，喜欢煮热可可，总在深夜等你消息"></textarea>
    <label>TA 的思维方式（可多选）</label><div class="chips" id="fThink"></div>
    <label>说话方式（可多选）</label><div class="chips" id="fStyle"></div>
    <label>口头禅 / 语气细节</label><textarea id="fTalk" rows="2" placeholder="例如：爱说“慢慢来”，偶尔会发颜文字 (๑•̀ㅂ•́)و"></textarea>
    <label>开场语录的字体</label><div class="chips" id="fFont"></div>
    <label>我的专属语录（一行一句，可用 {n} 代表称呼；打开时会优先出现）</label><textarea id="fQuote" rows="3" placeholder="例如：{n}，今天也要记得想我一下"></textarea>
    <label>想让 TA 记住的事</label><textarea id="fMem" rows="2" placeholder="例如：我怕黑、喜欢草莓味、周五加班很累"></textarea>
    <label>TA 不会做的事（你的安全边界）</label><textarea id="fBound" rows="2" placeholder="例如：不说教、不催我睡觉、不提前任"></textarea>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="saveChar()">保存 TA</button><button class="btn ghost" onclick="newChar()">再创造一位</button><button class="btn ghost" id="delC" onclick="delChar()">告别</button></div>
  </div>
</section>
<!-- 日记 -->
<section class="view" id="v-diary">
  <h1>树洞日记</h1><div class="sub">只存在这台设备里，没有别人能看见。</div><div style="height:10px"></div>
  <div class="card"><textarea id="dText" rows="4" placeholder="今天发生了什么？不用写得好看。"></textarea>
    <div style="margin-top:10px;text-align:right"><button class="btn" onclick="addDiary()">收进树洞 🌙</button></div></div>
  <div class="card"><h2>💌 收藏的话</h2><div class="sub" id="fEmpty">在聊天里双击 TA 的消息，就会存在这里。</div><div id="fList"></div></div>
  <div class="card"><h2>📊 本周情绪小结</h2><div class="sub" id="rText" style="color:var(--tx);font-size:14.5px;white-space:pre-wrap">让 TA 回顾你这一周，温柔地说几句话。</div><div style="margin-top:12px"><button class="btn" id="rBtn" onclick="getReport()">生成小结</button></div></div>
  <div class="card"><h2>我的记录</h2><div id="dList"></div></div>

  <!-- GitHub 记忆同步与安全设置 -->
  <div class="card"><h2>GitHub 记忆同步与安全</h2>
    <div class="sub" id="ghSt" style="margin-bottom:8px">无需 Supabase，全部记忆支持自动同步到你的 GitHub 仓库中。</div>
    <label>GitHub 用户名</label><input id="ghUser" placeholder="例如：yourname">
    <label>GitHub 仓库名</label><input id="ghRepo" placeholder="例如：weiguang">
    <label>GitHub Token (Personal Access Token)</label><input id="ghToken" type="password" placeholder="ghp_xxxxxxxxxxxx">
    <div class="chips" style="margin-top:10px">
      <button class="chip" onclick="saveGHConfig()">💾 保存配置</button>
      <button class="chip" onclick="syncToGH()">☁️ 同步到 GitHub</button>
      <button class="chip" onclick="syncFromGH()">⬇️ 从 GitHub 恢复</button>
      <button class="chip" onclick="setPw()">🔒 设置/修改密码</button>
      <button class="chip" onclick="offPw()">关闭密码</button>
      <button class="chip" onclick="lockNow()">立即锁定</button>
      <button class="chip" onclick="wipe()">清除本机数据</button>
    </div>
  </div>
</section>
</main>
<nav id="nav"></nav>
</div>
<div id="splash" style="display:flex"><svg id="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"></svg><div id="spOv"></div><svg id="spHi" class="hand wr"></svg><svg id="spQ" class="hand wr"></svg><svg id="spSig" class="hand wr"></svg><div id="spDay"></div><div id="spTap">轻点一下，进来吧</div></div>
<div id="lock" style="display:none;position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,var(--bg1),var(--bg2));flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--tx)">
 <div class="av big">🔒</div><h2 id="lkT" style="margin:0"></h2><div id="dots" style="font-size:26px;letter-spacing:10px;height:34px;color:var(--pk)"></div>
 <div class="sub" id="lkMsg" style="height:18px"></div>
 <div id="pad" style="display:grid;grid-template-columns:repeat(3,70px);gap:12px"></div>
 <div><button class="x" id="lkCancel" onclick="lkHide()">取消</button> <button class="x" id="lkForgot" onclick="lkForgot()">忘记密码？</button></div></div>
<script>
const $=id=>document.getElementById(id);
const AVS=['🌸','🐰','🌙','⭐','🦋','🍓','🐱','☁️','🧸','🌷'],COLS=['#ffb3cc','#d6c8ff','#ffd6a5','#b8e6d4','#bfe0ff','#ffc2e0'];
const PERS=['温柔','治愈','阳光','沉稳','傲娇','腼腆','幽默','细心','包容','有点黏人','成熟','少年感'];
const STY=['软软的','爱用颜文字','简短克制','爱撒娇','像朋友聊天','文艺诗意','会叫我小名','偶尔调皮'];
const MOODS=[['😭','难过'],['😔','低落'],['😐','一般'],['🙂','还不错'],['🥰','很开心']];
const AFF=['你不需要很努力才值得被爱。','今天已经做得够好了，真的。','情绪来了就让它来，我陪着你。','慢一点也没关系，天不会塌。','你值得被温柔对待，包括被自己。','先喝口水，再抱抱自己。'];
const QUICK=['今天有点累','想被抱抱','陪我聊聊睡前的想法','我有点焦虑','想跟你说件开心的事','今天遇到个烦人的事','陪我选晚饭吃什么','你今天过得怎么样','给我讲个小故事','想你了','我睡不着','夸夸我'];
const ACT=[['🤗 抱抱','（我走过去，轻轻抱住你）'],['🫶 牵手','（我伸手牵住你的手）'],['🥺 求摸头','（我歪着头，等你摸摸我的头）'],['🌙 晚安','晚安，今天也辛苦啦']],STK=['😊','🥰','😭','🥺','😴','😤','🙈','🤗','💗','🌙','✨','🍓','☕','🫶','😮‍💨','🌧️'];
function sendMood(i){S.moods[tdy()]=i;save();say('我现在的心情：'+MOODS[i][0]+' '+MOODS[i][1])}
const NAV=[['home','<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>','首页'],['chat','<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>','聊天'],['make','<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.500-7 10-7 10z"/></svg>','TA'],['diary','<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16H6zM9 8h6M9 12h6"/></svg>','树洞']];
const THINK=['先听我说完','理性帮我分析','敢温柔地指出问题','做决定前帮我想清楚','主动关心我'],THINK0=['先听我说完','理性帮我分析','敢温柔地指出问题','主动关心我'];
const MODES={listen:['💭 只想倾诉','专注倾听、复述并接住她的感受，先不要给建议'],analyze:['🧠 帮我分析','理性拆解问题，指出关键点与你的判断'],comfort:['🫂 想被安慰','给足温暖、陪伴与安全感'],advice:['🎯 要建议','给出具体、可执行的下一步，并说明理由']};
const nickList=c=>((c.nick||'你').split(/[,，、\s]+/).filter(Boolean)),nickOf=c=>{const a=nickList(c);return a[Math.floor(Math.random()*a.length)]||'你'};
const FONTS={'可爱圆体':'ZCOOL KuaiLe','软手写':'Long Cang','行书':'Zhi Mang Xing'},applyFont=c=>document.documentElement.style.setProperty('--qf','"'+(c.font||'ZCOOL KuaiLe')+'"');
function addNick(x){const i=$('fNick'),a=nickList({nick:i.value});if(i.value.trim()===''||!a.includes(x))i.value=(i.value.trim()?i.value.trim()+'、':'')+x}
const KEY='weiguang_v1';
let S={chars:[],active:null,moods:{},diary:[],chats:{},contacts:[],greet:{},report:null,seen:{},mode:'',since:'',q:'',lq:'',favs:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(!S.chars.length){S.chars.push({id:'c'+Date.now(),av:'🌙',col:'#bfe0ff',name:'阿屿',nick:'你',gender:'男生',pers:['沉稳','细心','包容'],bio:'成熟可靠、理性却很会听人说话的男生。说话直接但温柔，会认真替你想清楚。',style:['像朋友聊天','简短克制'],talk:'爱说“我在，慢慢说”',mem:'',bound:'不说教，不替我做决定'});S.active=S.chars[0].id;save()}
const cur=()=>S.chars.find(c=>c.id===S.active)||S.chars[0];
const tdy=()=>new Date().toISOString().slice(0,10);
let form={};
/* nav */
$('nav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('v-'+v).parentElement.scrollTop=0;
 if(v==='home')renderHome();if(v==='chat')renderChat();if(v==='make')loadForm(cur());if(v==='diary')renderDiary();
 document.querySelector('main').style.paddingBottom=v==='chat'?'0':'';}
/* home */
function avEl(el,c){el.textContent=c.img?'':c.av;el.style.background=c.img?`center/cover url(${c.img})`:c.col}
function renderHome(){const c=cur(),h=new Date().getHours();applyFont(c);renderGreet();
 $('hello').textContent=(h<6?'夜深了':h<12?'早安':h<18?'下午好':'晚上好')+'，'+(nickOf(c));
 $('aff').textContent=S.q||AFF[new Date().getDate()%AFF.length];
 avEl($('hAv'),c);$('hName').textContent=c.name;$('hDesc').innerHTML='<span class="dot"></span>'+status(c)+'<br>我们在一起的第 '+days()+' 天';
 $('moodPick').innerHTML=MOODS.map((m,i)=>`<button class="mood ${S.moods[tdy()]===i?'sel':''}" onclick="setMood(${i})" title="${m[1]}">${m[0]}</button>`).join('');
 const bars=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10),v=S.moods[d];bars.push(v==null?'<div class="bar e" style="height:8%"></div>':`<div class="bar" style="height:${20+v*20}%" title="${MOODS[v][1]}"></div>`)}$('bars').innerHTML=bars.join('');$('charList').innerHTML=S.chars.map(x=>`<button class="chip ${x.id===c.id?'sel':''}" onclick="S.active='${x.id}';save();renderHome()">${x.av} ${x.name}</button>`).join('')+`<button class="chip" onclick="newChar()">＋ 新的TA</button>`}
function setMood(i){S.moods[tdy()]=i;save();renderHome();$('moodNote').textContent=['抱抱你，难过也是被允许的 🫂','辛苦了，今天不用逞强','平平淡淡也很好','真好，把这份轻松收好','太好了！想和TA分享吗？'][i]}
/* chat */
const hist=()=>S.chats[S.active]||(S.chats[S.active]=[]);
function bubble(t,who){const d=document.createElement('div');d.className='m '+who;d.textContent=t;if(/^[\p{Extended_Pictographic}\u200d\ufe0f]{1,6}$/u.test(t))d.classList.add('big');
 if(who==='ai')d.ondblclick=()=>{if(!t)return;S.favs=S.favs||[];if(!S.favs.some(f=>f.t===t)){S.favs.unshift({t,c:cur().name,d:new Date().toLocaleDateString('zh-CN')});save()}d.classList.add('faved')};
 $('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
function care(c){if(c.gender!=='女生'&&c.gender!=='不设定'){const m=S.moods[tdy()],n=nickOf(c),h=new Date().getHours();return m!=null&&m<=1?`${n}，我看得出你今天不太开心。想说就说，不想说，我就陪你坐一会儿。`:(h<5||h>=23)?`${n}，这么晚了怎么还没睡？有心事就告诉我，我不困。`:`${n}，来了？今天有没有好好吃饭？想聊什么都行，也可以发张照片给我看看。`}const m=S.moods[tdy()],n=nickOf(c),h=new Date().getHours();return m!=null&&m<=1?`${n}，我看到你今天心情有点低。想跟我说说发生了什么吗？不想说也没关系，我陪着你。`:(h<5||h>=23)?`${n}，这么晚了还没睡吗？今天有什么想放下的事，可以交给我听。`:`${n}，你来啦。今天有没有好好吃饭？想聊点什么，或者发张照片给我看看都可以。`}
let lastT=0;
function addMsg(m){if(m.t&&m.t-lastT>18e5){const d=document.createElement('div');d.className='ts';d.textContent=new Date(m.t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('msgs').appendChild(d)}if(m.t)lastT=m.t;
 const txt=m.content.replace(/^[她分享了一张照片] /,'');
 if(m.role==='user'){const b=bubble(txt,'me');if(m.img){const im=new Image();im.src=m.img;im.style.cssText='display:block;max-width:180px;border-radius:12px;margin-bottom:6px';b.prepend(im)}return b}
 let b;txt.split(/\n\s*\n/).filter(x=>x.trim()).forEach(x=>b=bubble(x.trim(),'ai'));return b||bubble(txt,'ai')}
function renderChat(){const c=cur();avEl($('cAv'),c);$('cName').textContent=c.name;$('msgs').innerHTML='';lastT=0;$('cSt').innerHTML='<span class="dot"></span>'+status(c)+' · 在一起第 '+days()+' 天';
 const h=hist();if(!h.length)bubble(care(c),'ai');h.forEach(addMsg);
 if(h.length&&Date.now()-(S.seen[S.active]||0)>216e5){const t=care(c);h.push({role:'assistant',content:t,t:Date.now()});bubble(t,'ai')}
 S.seen[S.active]=Date.now();save();
 $('modes').innerHTML='<span class="sub" style="align-self:center">我想：</span>'+Object.entries(MODES).map(([k,v])=>`<button class="chip ${S.mode===k?'sel':''}" onclick="S.mode=S.mode==='${k}'?'':'${k}';save();renderChat()">${v[0]}</button>`).join('');
 $('quick').innerHTML=[...QUICK].sort(()=>Math.random()-.5).slice(0,7).map(q=>`<button class="chip" onclick="say('${q}')">${q}</button>`).join('');
 $('cm').innerHTML=MOODS.map((m,i)=>`<button class="chip" onclick="sendMood(${i})">${m[0]} ${m[1]}</button>`).join('');
 $('pin').textContent=S.q\vert{}\vert{}'';$('pin').style.display=S.q?'':'none';
 $('tools').innerHTML=ACT.map((x,i)=>`<button class="chip" onclick="say(ACT[${i}][1])">${x[0]}</button>`).join('')+'<button class="chip" onclick="$(\'stk\').style.display=$(\'stk\').style.display===\'none\'?\'flex\':\'none\'">😊 表情</button>';
 $('stk').innerHTML=STK.map(e=>`<button class="chip" style="font-size:20px;padding:4px 10px" onclick="say('${e}')">${e}</button>`).join('')}
function toggleDrawer(){$('toolsDrawer').classList.toggle('open')}
function clearChat(){S.chats[S.active]=[];save();renderChat()}
function sys(c){const md=MODES[S.mode];return `你是「${c.name}」，${c.gender||'男生'}形象，是她亲手创造、陪在她身边的恋人。她是一位需要安全感与倾听的女孩，她在需要倾诉和依靠时选择了你，请珍惜这份信任。

l:['这么晚还没睡，是有心事吗？说给我听，我不睡。','{n}，把手机亮度调低一点，我陪你待一会儿。','睡不着的话，我讲点没用的事陪你，直到你困。','今天已经够了，剩下的明天我陪你一起扛。','晚安之前，先让我说一句：你已经做得很好了。','别一个人胡思乱想，我在这儿，哪也不去。']};
const STS={m:['刚起床，在煮咖啡','在去上班的路上','在看今天的安排'],d:['在忙，看到你的消息会回','刚开完会','在吃午饭','在喝咖啡'],n:['刚下班，在回家的路上','在做晚饭','在楼下散步','窝在沙发上'],l:['洗完澡了','还没睡，在想你','睡前看会儿书']};
function status(c){const a=STS[pOf(new Date().getHours())];return a[(Math.floor(Date.now()/36e5)+(c.name||'').length)%a.length]}
const rnd=(a,b)=>a+Math.random()*(b-a);
const PD="M205 810 C110 720 310 650 215 570 S140 440 235 360 S205 290 250 238";
function fl(x,y,r,c,m){let q='';for(let i=0;i<5;i++){const a=i*1.2566;q+=`<circle cx="${(Math.cos(a)*r*.6).toFixed(1)}" cy="${(Math.sin(a)*r*.6).toFixed(1)}" r="${(r*.55).toFixed(1)}"/>`}return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><g class="fw" style="animation-delay:${-rnd(0,6).toFixed(1)}s;transform-origin:50% 50%"><g fill="${c}">${q}</g><circle r="${(r*.32).toFixed(1)}" fill="${m}"/></g></g>`}
function delph(x,y,h,c){let q=`<line x1="0" y1="0" x2="0" y2="${h}" stroke="#2f6a3a" stroke-width="2"/>`;for(let i=0;i<h/11;i++)q+=`<circle cx="${rnd(-3,3).toFixed(1)}" cy="${(i*11).toFixed(0)}" r="${Math.max(3,8-i*.6).toFixed(1)}" fill="${c}"/>`;return `<g transform="translate(${x} ${y})"><g class="fw" style="animation-delay:${-rnd(0,6).toFixed(1)}s">${q}</g></g>`}
function buildScene(g){g=g||'sk';const G=[['#4d7d44',120],['#3a6a3a',260],['#2c5731',440],['#1f4527',620]];let o='<defs><linearGradient id="'+g+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9ea"/><stop offset="1" stop-color="#e8f1dc"/></linearGradient></defs><rect width="400" height="800" fill="url(#'+g+')"/>';
 G.forEach(([c,y],i)=>{let e='';for(let k=0;k<6;k++)e+=`<ellipse cx="${rnd(0,400).toFixed(0)}" cy="${rnd(y+30,y+150).toFixed(0)}" rx="${rnd(40,90).toFixed(0)}" ry="${rnd(14,30).toFixed(0)}" fill="#8fbf6a" opacity=".16"/>`;
  o+=`<g class="hl" style="animation-duration:${9+i*2}s;animation-delay:${-i*3}s"><path d="M-20 ${y} Q80 ${y-55} 190 ${y-8} T420 ${y-30} V800 H-20Z" fill="${c}"/>${e}</g>`;
  if(i===1)o+=`<path d="M232 236V212a20 20 0 0 1 40 0v24z" fill="#f2a0bf"/><rect x="245" y="214" width="14" height="22" rx="7" fill="#2a2326"/>`;
  if(i===1)o+=`<path d="${PD}" fill="none" stroke="#b9d489" stroke-width="30" stroke-linecap="round" opacity=".9"/><path d="${PD}" fill="none" stroke="#e8f2b8" stroke-width="16" stroke-linecap="round" opacity=".9"/>`});
 const cs=['#f6a6c4','#ffe27a','#ffffff','#f58a8a','#9fb8f0'];
 for(let i=0;i<70;i++){const y=rnd(130,790);o+=fl(rnd(0,400),y,rnd(3,7)+y/200,cs[i%5],i%5===1?'#e58a3a':'#ffd75a')}
 o+=delph(345,330,100,'#5b7fd6')+delph(372,380,90,'#7d9be6')+delph(318,420,70,'#6a8ce0');
 o+=fl(18,560,36,'#fff','#ffd75a')+fl(380,520,34,'#f27fa5','#e45a85')+fl(30,400,22,'#ffd75a','#e58a3a')+fl(60,700,28,'#f6a6c4','#ffd75a')+fl(350,690,26,'#fff','#ffd75a');
 o+=`<g><path d="M-7 11L0-5L7 11Z" fill="#f2c441"/><circle cy="-9.5" r="3.7" fill="#2b2118"/><circle cy="-8.2" r="3" fill="#f1d3bd"/><animateMotion dur="50s" begin="1s" fill="freeze" path="${PD}" keyPoints=".5;.8" keyTimes="0;1" calcMode="linear"/></g>`;return o}
function writeSvg(el,txt,fs,st,step,mc){const lines=[];let cu=[];[...txt].forEach(c=>{if(cu.length>=mc&&!/[，。！？、,.!?…]/.test(c)){lines.push(cu);cu=[]}cu.push(c)});if(cu.length)lines.push(cu);
 const W=340,lh=fs*1.55;let k=0,out='';lines.forEach((ln,li)=>{out+=`<text x="${W/2}" y="${fs+li*lh}" text-anchor="middle" font-size="${fs}">`+ln.map(c=>{const d=st+(k++)*step;return `<tspan class="w" style="animation-delay:${d.toFixed(2)}s,${(d+.8).toFixed(2)}s">${c}</tspan>`}).join('')+'</text>'});
 el.setAttribute('viewBox',`0 0 ${W} ${(lines.length*lh+8).toFixed(0)}`);el.style.setProperty('--d',fs*10);el.innerHTML=out;return st+k*step+.9}
try{$('bg').innerHTML=buildScene('sk2')}catch(e){}
let splashed=false;
function startSplash(){if(splashed)return;splashed=true;const c=cur(),P=pOf(new Date().getHours()),n=nickOf(c),sp=$('splash'),pool=((c.quotes&&c.quotes.length&&Math.random()<.6)?c.quotes:((c.gender==='女生'||c.gender==='不设定')?QS[P]:QSM[P]));applyFont(c);
 let q;do{q=pool[Math.floor(Math.random()*pool.length)]}while(q===S.lq&&pool.length>1);S.lq=q;S.q=q.replace(/\{n\}/g,n);save();
 try{$('scene').innerHTML=buildScene()}catch(e){}$('spOv').style.background=`rgba(6,16,34,${{m:.12,d:.08,n:.3,l:.5}[P]})`;
 let t=writeSvg($('spHi'),{m:'早安',d:'午安',n:'晚上好',l:'夜深了'}[P]+'，'+n,40,.8,.28,8);t=writeSvg($('spQ'),S.q,24,t+.2,.2,12);t=writeSvg($('spSig'),'—— '+c.name,22,t+.2,.25,12);$('spDay').textContent='我们在一起的第 '+days()+' 天';
 for(let i=0;i<18;i++){const d=document.createElement('span'),z=3+Math.random()*4;d.className='pt';d.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*12}s`;sp.appendChild(d)}
 setTimeout(()=>$('spTap').classList.add('on'),(t+.3)*1000);sp.style.display='flex';setTimeout(()=>{if(sp.style.display!=='none')sp.onclick()},(t+4.5)*1000);
 sp.onclick=()=>{if(sp.classList.contains('out'))return;sp.classList.add('out');setTimeout(()=>{sp.style.display='none';renderHome()},900)}}

/* lock */
const PK='weiguang_pin';let lk={mode:'',buf:'',first:''},away=0;
const getPin=()=>{try{return localStorage.getItem(PK)}catch(e){return null}};
async function hsh(x){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('wg:'+x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const ch of 'wg:'+x)h=(h*33^ch.charCodeAt(0))>>>0;return'f'+h}}
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','清除','0','⌫'].map(k=>`<button class="chip" style="height:60px;font-size:22px;border-radius:30px" onclick="lkKey('${k}')">${k}</button>`).join('');
function showLock(m,msg){lk={mode:m,buf:'',first:''};$('lock').style.display='flex';lkRender(msg)}
function lkHide(){$('lock').style.display='none';startSplash()}
function lkRender(msg){$('lkT').textContent={unlock:'输入密码解锁',set:'设置 4 位数字密码',confirm:'再输入一次确认',chg:'输入当前密码',off:'输入密码以关闭'}[lk.mode];$('dots').textContent='●'.repeat(lk.buf.length)+'○'.repeat(4-lk.buf.length);$('lkMsg').textContent=msg||'';$('lkCancel').style.display=lk.mode==='unlock'?'none':'';$('lkForgot').style.display=getPin()?'':'none'}
async function lkKey(k){if(k==='清除')lk.buf='';else if(k==='⌫')lk.buf=lk.buf.slice(0,-1);else if(lk.buf.length<4)lk.buf+=k;lkRender();if(lk.buf.length<4)return;
 const v=lk.buf;lk.buf='';
 if(lk.mode==='set'){lk.first=v;lk.mode='confirm';return lkRender()}
 if(lk.mode==='confirm'){if(v===lk.first){try{localStorage.setItem(PK,await hsh(v))}catch(e){}lkHide();alert('密码已设置 🔒');return}lk.mode='set';return lkRender('两次不一致，重新来一次')}
 if(await hsh(v)!==getPin())return lkRender('不对哦，再试一次');
 if(lk.mode==='unlock')lkHide();else if(lk.mode==='chg'){lk.mode='set';lkRender()}else if(lk.mode==='off'){try{localStorage.removeItem(PK)}catch(e){}lkHide();alert('密码已关闭')}}
function setPw(){showLock(getPin()?'chg':'set')}
function offPw(){getPin()?showLock('off'):alert('当前没有设置密码')}
function lockNow(){getPin()?showLock('unlock'):alert('请先设置密码')}
function lkForgot(){if(confirm('忘记密码只能清除本机数据后重新开始。确定吗？'))wipe()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)away=Date.now();else if(getPin()&&away&&Date.now()-away>6e4&&lk.mode!=='unlock'||getPin()&&away&&Date.now()-away>6e4&&$('lock').style.display==='none')showLock('unlock')});
if(getPin()){$('splash').style.display='none';showLock('unlock')}else startSplash();
go('home');
</script>
